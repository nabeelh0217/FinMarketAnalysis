data:
  source: synthetic
  dataset_id: synthetic_null
  raw_dir: data/raw/synthetic_null
  processed_dir: data/processed
  manifest_dir: data/manifests
  levels: 10
  price_scale: 10000
  tick_size: 100
  lot_size: 100
  open_time: 09:30:00
  close_time: '10:00:00.000000000'
  sessions: []
  synthetic:
    scenario: 'null'
    ticker: SYNTH
    first_date: '2099-01-05'
    n_sessions: 10
    duration_s: 1800.0
    seed: 7
    initial_mid_ticks: 3000
    init_levels: 10
    init_orders_per_level: 3
    limit_rate: 20.0
    limit_distance_alpha: 0.8
    max_distance: 10
    market_rate: 3.0
    null_market_rate: 3.0
    cancel_rate_per_order: 0.3
    partial_cancel_prob: 0.2
    mean_limit_lots: 2.0
    mean_market_lots: 1.6
    fair_value_vol: 0.3
    jump_rate: 0.003
    jump_size_ticks: 2.0
    informed_rate: 0.0
    informed_scale_ticks: 0.5
    limit_tilt: 0.0
  max_gap_warning_s: 30.0
  license_note: Synthetic data generated by adaptive_market_maker.data.synthetic;
    no license restrictions.
features:
  depth_levels:
  - 1
  - 3
  - 5
  - 10
  depth_weights: uniform
  event_windows:
  - 10
  - 50
  - 200
  time_windows_s:
  - 1.0
  - 5.0
  - 30.0
  vol_window_s: 30.0
  vol_floor_ticks_per_sqrt_s: 0.01
  warmup_s: 60.0
models:
  labels:
    kind: time
    horizon_events: 10
    horizon_ms: 1000.0
    classes: ternary
    flat_threshold_ticks: 0.0
  splits:
    mode: sessions
    train_frac: 0.5
    val_frac: 0.2
    train_sessions: 4
    val_sessions: 2
    embargo_s: 0.0
    exclude_open_s: 120.0
    exclude_close_s: 30.0
  fill_model:
    horizon_s: 10.0
    n_shadow_orders: 4000
    seed: 11
  candidates:
  - prior
  - logistic
  - hgb
  feature_groups: null
  logistic_C: 0.5
  logistic_max_iter: 1000
  hgb_max_iter: 150
  hgb_learning_rate: 0.05
  hgb_max_leaf_nodes: 15
  hgb_min_samples_leaf: 200
  hgb_l2: 1.0
  calibrate: true
  eval_stride: non_overlapping
  max_train_samples: 200000
  seed: 0
execution:
  fill_preset: central
  conservative_extra_queue_frac: 0.0
  post_only: true
  latency:
    market_data_us: 250.0
    decision_us: 20.0
    order_entry_us: 250.0
    report_us: 250.0
  fees:
    maker_per_share: -0.002
    taker_per_share: 0.003
strategies:
  fixed_spread:
    quote_size: 100
    requote_threshold_ticks: 0
    rounding: nearest
    half_spread_ticks: 0.5
  inventory_aware:
    quote_size: 100
    requote_threshold_ticks: 0
    rounding: nearest
    gamma: 0.1
    k: 1.5
    A: 1.0
    horizon_mode: rolling
    tau_s: 30.0
    spread_mode: fixed
    half_spread_ticks: 0.5
    min_half_spread_ticks: 0.5
    use_vol_adaptation: true
    static_vol_ticks_per_sqrt_s: 0.1
    use_inventory_skew: true
    estimate_fill_intensity: false
  adaptive:
    quote_size: 100
    requote_threshold_ticks: 0
    rounding: nearest
    gamma: 0.1
    k: 1.5
    A: 1.0
    horizon_mode: rolling
    tau_s: 30.0
    spread_mode: fixed
    half_spread_ticks: 0.5
    min_half_spread_ticks: 0.5
    use_vol_adaptation: true
    static_vol_ticks_per_sqrt_s: 0.1
    use_inventory_skew: true
    estimate_fill_intensity: false
    alpha_weight: 1.0
    alpha_clip_ticks: 2.0
    alpha_guard_ticks: 0.25
    use_alpha: true
  regime:
    quote_size: 100
    requote_threshold_ticks: 0
    rounding: nearest
    gamma: 0.1
    k: 1.5
    A: 1.0
    horizon_mode: rolling
    tau_s: 30.0
    spread_mode: fixed
    half_spread_ticks: 0.5
    min_half_spread_ticks: 0.5
    use_vol_adaptation: true
    static_vol_ticks_per_sqrt_s: 0.1
    use_inventory_skew: true
    estimate_fill_intensity: false
    alpha_weight: 1.0
    alpha_clip_ticks: 2.0
    alpha_guard_ticks: 0.25
    use_alpha: true
    high_vol_ticks_per_sqrt_s: 1.0
    wide_spread_ticks: 3
    high_vol_size_mult: 0.0
    wide_spread_extra_ticks: 0.5
  risk:
    max_inventory: 500
    max_order_size: 300
    max_outstanding_per_side: 300
    max_notional: 250000.0
    max_actions_per_second: 20.0
    max_quote_age_s: null
    max_market_spread_ticks: 10
    max_price_deviation_ticks: 10
    max_session_loss: 2000.0
    stale_data_s: 5.0
backtest:
  flatten_before_end_s: 30.0
  equity_interval_s: 1.0
  decision_min_interval_ms: 0.0
  markout_horizons_ms:
  - 100.0
  - 1000.0
  - 5000.0
  - 30000.0
  bootstrap_block_s: 60.0
  bootstrap_blocks_per_draw: 3
  n_bootstrap: 2000
  seed: 0
experiment:
  id: synthetic_null_baseline
  description: Same protocol as synthetic_informed_baseline on the uninformed (null)
    synthetic market.
  kind: confirmatory
  strategies:
  - fixed_spread
  - inventory_aware
  - adaptive
  - regime
  validation_grid:
    fixed_spread:
      half_spread_ticks:
      - 0.5
      - 1.5
    inventory_aware:
      gamma:
      - 0.02
      - 0.1
      - 0.3
    adaptive:
      alpha_guard_ticks:
      - 0.15
      - 0.3
      - null
  sensitivity:
    latency_us:
    - 0
    - 250
    - 5000
    execution.fill_preset:
    - conservative
    - central
    - optimistic
  sensitivity_strategies:
  - fixed_spread
  - inventory_aware
  - adaptive
  ablations:
  - no_alpha
  - placebo_alpha
  - no_alpha_guard
  output_dir: reports/experiments
  overwrite: false
  n_jobs: 4
