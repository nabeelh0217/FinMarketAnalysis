# `amm experiment ablation`: the baseline protocol, robustness phase restricted to ablations.
include: [configs/data_synthetic.yaml]
models:
  splits: {mode: sessions, train_sessions: 4, val_sessions: 2, exclude_open_s: 120, exclude_close_s: 30, embargo_s: 0}
experiment:
  id: synthetic_informed_ablation
  strategies: [fixed_spread, inventory_aware, adaptive]
  validation_grid:
    inventory_aware: {gamma: [0.02, 0.1, 0.3]}
    adaptive: {alpha_guard_ticks: [0.15, 0.3, null]}
  ablations: [no_alpha, no_alpha_shift, no_alpha_guard, no_inventory_skew, no_vol_adaptation, fill_aware_glft,
              "drop:book_l1", "drop:microprice", "drop:multi_level", "drop:order_flow", "drop:trade_flow"]
  n_jobs: 4
