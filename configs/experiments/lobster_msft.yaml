# REAL DATA: LOBSTER free sample, MSFT 2012-06-21, one session -> intraday chronological split.
# Requires the sample files in data/raw/lobster/ (see README). One session cannot establish a durable edge.
include: [configs/data.yaml]
experiment:
  id: lobster_msft_baseline
  description: Pre-declared A/B/C/D comparison on the held-out final 30% of the MSFT session.
  kind: confirmatory
  strategies: [fixed_spread, inventory_aware, adaptive, regime]
  validation_grid:
    fixed_spread: {half_spread_ticks: [0.5, 1.5]}
    inventory_aware: {gamma: [0.02, 0.1, 0.3]}
    adaptive: {alpha_guard_ticks: [0.15, 0.3, null]}
  sensitivity:
    latency_us: [0, 100, 250, 1000, 5000, 20000]
    execution.fees.maker_per_share: [-0.003, -0.002, 0.0, 0.001]
    execution.fill_preset: [conservative, central, optimistic]
    strategies.*.quote_size: [100, 200, 300]
    strategies.risk.max_inventory: [200, 500, 1000]
    strategies.*.gamma: [0.02, 0.1, 0.3, 1.0]
    features.vol_window_s: [10, 30, 120]
    models.labels.horizon_ms: [250, 1000, 5000]
    backtest.decision_min_interval_ms: [0, 100, 1000]
  ablations: [no_alpha, placebo_alpha, no_alpha_shift, no_alpha_guard, no_inventory_skew, no_vol_adaptation, fill_aware_glft,
              "drop:book_l1", "drop:microprice", "drop:multi_level", "drop:order_flow", "drop:trade_flow", "drop:order_flow+trade_flow+activity"]
  n_jobs: 4
